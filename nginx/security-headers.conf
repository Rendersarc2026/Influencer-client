# Included in every location of default.conf. nginx drops server-level
# add_header directives from any location that declares its own, so the
# headers live here and each location includes them explicitly.

# Content-Security-Policy: defence in depth against XSS.
# 'unsafe-inline' is present for style-src only due to Emotion (MUI runtime styles).
# blob: in img-src is required for local file previews (URL.createObjectURL) in the
# attachment/screenshot dialogs, which render thumbnails before anything is uploaded.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
