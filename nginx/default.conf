# Serves the built SPA inside the client container. TLS and the public domain
# are handled by nginx on the host, which proxies to this container over plain
# HTTP on port 80.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Behind the host proxy, redirects must not carry this container's :80.
    absolute_redirect off;

    # Cap request bodies: this container only serves static files.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed asset filenames are immutable, so cache indefinitely (1 year).
    # A missing asset is a real 404 — returning index.html as JavaScript would
    # only produce a confusing MIME-type error in the browser.
    location ~* \.(?:js|css|png|jpe?g|gif|ico|svg|woff2?|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html and SPA route fallbacks must never be cached so new deploys
    # load immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # SPA routing fallback: unmatched paths render the app, which routes.
        try_files $uri /index.html;
    }
}
