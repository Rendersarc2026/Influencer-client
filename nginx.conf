server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the server version.
    server_tokens off;

    # Cap request bodies: this server only serves static files, so anything
    # large is either a mistake or an attempt to exhaust memory.
    client_max_body_size 1m;

    # --- Security headers -------------------------------------------------
    # Content-Security-Policy is the main defence in depth against XSS: even if
    # a script string reaches the DOM, it cannot execute from an inline block or
    # load from another origin.
    #
    # 'unsafe-inline' is present for style-src only, because Emotion (MUI's
    # styling engine) injects inline <style> elements at runtime. script-src has
    # no such escape hatch.
    #
    # connect-src must list the API origin. It is templated at image build time;
    # replace API_ORIGIN if the API is not same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost:3000; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Never let a browser guess a response's type — sniffing is what turns an
    # uploaded text file into executed script.
    add_header X-Content-Type-Options "nosniff" always;
    # Defence in depth against clickjacking for older browsers that ignore CSP
    # frame-ancestors.
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No use for these APIs; deny them rather than leave them available.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Enable once the deployment terminates TLS:
    # add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed asset filenames are immutable, so they can be cached indefinitely.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, no-transform";
        access_log off;
    }

    # index.html must never be cached, or a returning visitor keeps loading the
    # previous deploy's asset references.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
